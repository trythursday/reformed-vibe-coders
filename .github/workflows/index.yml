name: Pledge index

on:
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pledge-index
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issue_comment' || github.event.issue.number == fromJSON(vars.PLEDGE_ISSUE || '1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build pages
        run: bun scripts/build-index.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLEDGE_ISSUE: ${{ vars.PLEDGE_ISSUE || '1' }}
          OUT_DIR: site

      - name: Publish to the site branch
        run: |
          cd site
          git init -q -b site
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Publish ${GITHUB_SHA::7}"
          git push -f origin site
