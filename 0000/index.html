<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pledges, page 1</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/trythursday/fieber@main/fieber.css"
    />
    <style>
      h1 {
        text-align: center;
      }

      blockquote.pledge {
        text-align: center;
      }

      .pledges {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .pledges li {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        padding-block: 0.75rem;
        border-bottom: 1px solid var(--c-tag-bg);
      }

      @media (min-width: 769px) {
        .pledges li {
          flex-direction: row;
          flex-wrap: wrap;
          align-items: baseline;
          gap: 0.5ch;
        }

        .pledges .pledge-date {
          margin-inline-start: auto;
        }
      }

      .pager {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-block-start: 3rem;
      }

      .pledge-cta {
        margin-block: 2rem 3rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Have You Considered Building Less?</h1>
    </header>

    <main>
      

      
      <p class="pledge-cta">
        0 coders put their tokens where their mouth is.
        <a href="../">Take the pledge today</a>.
      </p>
      

      <section>
        <h2>
          Pledges - Page 1
        </h2>
        <ul class="pledges">
          
        </ul>
      </section>

      
    </main>

    <footer>
      <p class="muted">
        Submitting posts your pledge as a comment on the pledge list.
      </p>
    </footer>
  </body>
</html>
